[build-system]
requires = ["hatchling>=1.27", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "chainlens"
dynamic = ["version"]
description = "Async-first blockchain chain analysis and forensics for Bitcoin and Ethereum"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Patrick Mockridge" }]
keywords = [
  "blockchain",
  "bitcoin",
  "ethereum",
  "forensics",
  "chain-analysis",
  "osint",
  "clustering",
  "graph",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Typing :: Typed",
]
dependencies = [
  # Hard upper bound: httpx 1.0.dev exists and will be breaking. See docs/explanation.
  "httpx>=0.28,<1.0",
  # The [async] extra pulls anysqlite, required by hishel's AsyncSqliteStorage.
  # There is no dependency-free async disk store in hishel; the only alternatives
  # are a sync store (wrong for our event loop) or Redis (a server).
  "hishel[async]>=1.4",       # RFC 9111 HTTP caching for httpx
  "tenacity>=9.1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.4",
  "anyio>=4.6",
  "rustworkx>=0.18",          # internal graph engine
  "jinja2>=3.1",
]

[project.optional-dependencies]
eth = ["web3>=7.16,<9"]       # ABI decode / EIP-55 only — deliberately NOT core
nx = ["networkx>=3.3"]        # interop + viz layouts
pandas = ["pandas>=2.2"]
# Reading posts into claims. Optional because most of the library answers questions about the
# chain without ever asking a model anything, and a caller who does not read posts should not
# carry an HTTP client for one.
llm = ["anthropic>=1.11,<2"]
social = ["pillow>=11"]       # image sniffing + downscaling before we send to vision
# Reading a corpus of your own material. Optional because of what needs a library: pypdf for a
# PDF's text layer, and Pillow for `--vision` -- a screenshot is usually a full-resolution capture
# and has to be shrunk before a model is asked to read it. Everything else the corpus reader
# accepts -- HTML, DOCX, ODT, RTF, email, plain text -- is read with the standard library, so a
# corpus of notes alone needs neither.
notes = ["pypdf>=5", "pillow>=10"]
# Reading a preset from a YAML file. Not core: the shipped presets are rendered into
# the keycard by `tools/gen_shipped_data.py`, so nothing in the library needs a YAML
# parser at run time — `presets/records.py::load_file` is the one caller, and it imports
# it where it is used. See that function for the regression this prevents.
presets = ["pyyaml>=6.0"]
all = ["chainlens[eth,nx,pandas,social]"]

# The library's first console script. It has to stay importable without triggering provider
# plugin discovery, which is why `chainlens.ui.cli` touches the registry only inside a command
# body -- see its module docstring.
[project.scripts]
chainlens = "chainlens.ui.cli:main"

[project.urls]
Homepage = "https://github.com/PatrickMockridge/chainlens"
Repository = "https://github.com/PatrickMockridge/chainlens"
Documentation = "https://github.com/PatrickMockridge/chainlens#readme"
Changelog = "https://github.com/PatrickMockridge/chainlens/blob/main/CHANGELOG.md"

# Built-in providers and heuristics are also declared as entry points, so the
# plugin mechanism is exercised by our own code rather than only by third parties.
[project.entry-points."chainlens.providers"]
esplora-mempool = "chainlens.adapters.mempool_space:MempoolSpaceProvider"
esplora-blockstream = "chainlens.adapters.blockstream:BlockstreamProvider"
jsonrpc-eth = "chainlens.adapters.jsonrpc_eth:JsonRpcEthProvider"
etherscan = "chainlens.adapters.etherscan:EtherscanProvider"
local-labels = "chainlens.labels.provider:LocalLabelProvider"

[project.entry-points."chainlens.heuristics"]
common-input-ownership = "chainlens.analysis.heuristics.common_input:CommonInputOwnership"
change-address = "chainlens.analysis.heuristics.change_address:ChangeAddressDetector"
address-reuse = "chainlens.analysis.heuristics.address_reuse:AddressReuse"
eth-deposit-address = "chainlens.analysis.heuristics.eth_deposit:EthDepositAddressHeuristic"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6",
  "pytest-recording>=0.14",
  "vcrpy>=8.3",
  "respx>=0.23",
  "hypothesis>=6.115",
  "syrupy>=4.7",
  "ruff>=0.9",
  "mypy>=1.13",
  "pre-commit>=4.0",
  "pycoin>=0.92",             # dev-only cross-validation oracle for the BTC codec
  "types-PyYAML>=6.0",        # stubs for parsing cassettes in tests
  "pyyaml>=6.0",              # the case-study manifest and the preset generator
  "pillow>=11",               # the [social] extra, exercised by the media tests
  "pypdf>=5",
  "anthropic>=1.11,<2",       # the [llm] extra, exercised by the extractor's tests
]
# The API reference is rendered from the docstrings into markdown and committed, so griffe is the
# whole Python side of the docs; the book itself is built by mdbook, which is not a Python
# dependency. See `tests/docs/gen_reference.py` and `book.toml`.
docs = ["griffelib>=2.3"]
notebooks = ["jupyter>=1.1", "nbval>=0.11", "matplotlib>=3.9"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
fallback_version = "0.1.0"

[tool.hatch.build.hooks.vcs]
version-file = "src/chainlens/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/chainlens"]

[tool.hatch.build.targets.sdist]
include = ["src/chainlens", "tests", "README.md", "LICENSE", "CHANGELOG.md"]

# --------------------------------------------------------------------------- #
# Ruff
# --------------------------------------------------------------------------- #
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = [
  "E", "W", "F",       # pycodestyle / pyflakes
  "I",                 # isort
  "N",                 # pep8-naming
  "UP",                # pyupgrade
  "B",                 # flake8-bugbear
  "A",                 # flake8-builtins
  "C4",                # flake8-comprehensions
  "DTZ",               # flake8-datetimez (tz-aware only)
  "TID",               # flake8-tidy-imports
  "RUF",               # ruff-specific
  "SIM",               # flake8-simplify
  "PTH",               # flake8-use-pathlib
  "RET",               # flake8-return
  "PERF",              # perflint
  "PT",                # flake8-pytest-style
  "ANN",               # flake8-annotations
]
ignore = [
  "ANN401",            # allow Any in **kwargs passthrough
  "DTZ005",            # datetime.now() without tz is caught by DTZ broadly
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "ARG", "S101", "SLF001"]
"docs/**" = ["ANN", "E501"]
# Generated from `specs/vocabulary/vocabulary.toml` by `tools/gen_vocabulary.py`. Its shape is
# the generator's -- one row's note is a prose sentence and is not going to be wrapped to the
# line length by hand, because the next `make vocabulary` would undo it. What holds it to the
# table is `tests/vocabulary/test_the_table.py`, not the linter.
"src/chainlens/vocabulary/_generated.py" = ["E501"]
"src/chainlens/_shipped_card.py" = ["E501"]

[tool.ruff.format]
# Markdown code fences are hand-aligned for readability (comments line up with
# the code they annotate). Reformatting them would break that alignment without
# improving anything a reader sees.
#
# The generated vocabulary module is here for the same reason in the other direction: it is
# emitted, not written, so a formatter pass over it is a change the next `make vocabulary`
# reverts -- and a `--check` failure that fixes itself on the following command is worse than
# no check at all.
exclude = ["**/*.md", "src/chainlens/vocabulary/_generated.py", "src/chainlens/_shipped_card.py"]

[tool.ruff.lint.isort]
known-first-party = ["chainlens"]

[tool.ruff.lint.pydocstyle]
convention = "google"

# --------------------------------------------------------------------------- #
# mypy
# --------------------------------------------------------------------------- #
[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
pretty = true
show_error_codes = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["hishel.*", "rustworkx.*", "web3.*", "pycoin.*", "syrupy.*", "anthropic.*"]
ignore_missing_imports = true

# --------------------------------------------------------------------------- #
# pytest
# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
testpaths = ["tests"]
# `tools/` on the path so a test can import a repository tool rather than re-implementing it.
# `gen_vocabulary.py` lives there rather than beside its test, because it is a tool with a
# `--check` mode a person runs; the wire contract's generator lives in `tests/docs/` because
# nothing but the docs build ever runs it. `tests/vocabulary/test_the_table.py` imports it.
#
# This is an ini option rather than a `conftest.py` in the test directory, because mypy refuses
# two files named `conftest.py` in one run and `tests/conftest.py` already exists.
pythonpath = ["tools"]
# `--allowed-hosts` carves loopback out of `--block-network`. The property that flag protects
# is "no test reaches the live internet", and a loopback socket is not the internet — which
# matters because the local server is tested by starting it and calling it, and blocking every
# socket made that impossible. The regex list is the smallest carve-out that works.
addopts = "-ra --strict-markers --strict-config --allowed-hosts=127\\.0\\.0\\.1"
markers = [
  "network: test requires live network access (excluded in CI via --block-network)",
]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["chainlens"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "\\.\\.\\.",
]
