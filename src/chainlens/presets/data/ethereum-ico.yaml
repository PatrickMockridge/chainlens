# The 2014 Ethereum crowdsale.
#
# Every field here is checkable against something outside this repository, which is the only reason
# the preset is worth having. The rate schedule and the funding address are published; the
# allocation is an independent record the caller supplies.
name: ethereum-ico
description: >-
  The ether pre-sale of July-September 2014. Bitcoin was paid in to one address, and the ether was
  issued in the genesis block in proportion to what each participant paid — so there is no transfer
  between a row's two addresses to find, and a check that looked for one would report a miss on
  every row.
chain: ethereum
source: https://github.com/ethereum/go-ethereum/wiki/Launching-the-Ether-Sales
funding_address: "36PrZ1KHYMpqSyAQXSG8VwbUiq2EogxLo2"
allocation_dataset: >-
  The genesis allocation: 8,893 prefund allocations, published in go-ethereum's alloc file and
  mirrored by Nethermind at https://github.com/NethermindEth/nethermind/blob/master/src/Nethermind/Chains/foundation.json
rates:
  # The sale opened at 2,000 ether per bitcoin and the rate stepped down over the 42 days, which is
  # why most rows in a table of it are round multiples and some are not. A row that matches no tier
  # is not wrong — it may be a purchase that straddled a change, or a total.
  - rate: 2000.0
    note: the opening rate, the first fourteen days
  - rate: 1750.0
    note: the second two weeks
  - rate: 1500.0
    note: the third two weeks
  - rate: 1337.0
    note: the final period, at the rate the sale closed on
notes:
  - >-
    The ether was minted at genesis rather than transferred, so a row's two addresses are a
    *common-control* assertion and not a payment. No transaction can confirm or refute it.
  - >-
    A row's implied rate is a blend when it reports totals or a purchase that straddled a rate
    change, so a row matching no tier is a question rather than an error.
