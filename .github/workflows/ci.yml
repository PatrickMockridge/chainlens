name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"

jobs:
  lint:
    name: lint + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # hatch-vcs needs tags for version derivation
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-groups
      - name: ruff check
        run: uv run ruff check --output-format=github .
      - name: ruff format
        run: uv run ruff format --check .
      - name: mypy
        # case-study/tools and tools are type-checked here as well as in `make typecheck`:
        # two different scopes would let a type error pass on one side and not the
        # other, which is the divergence that makes a local green run untrustworthy.
        run: uv run mypy src tests tools case-study/tools

  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-groups --python ${{ matrix.python-version }}
      # --block-network makes any accidental live request a hard failure, so a
      # developer's local-only success cannot hide a missing fixture.
      - name: pytest
        run: |
          uv run pytest --block-network \
            --cov --cov-report=term-missing --cov-report=xml \
            --cov-fail-under=90

  # `ruff`, `mypy` and `pytest` do not see `web/`, so without this the front end would be the
  # only ungated region in the tree.
  web:
    name: front end (typecheck, test, bundle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: lint
        run: npm run lint
        working-directory: web
      - name: typecheck
        run: npx tsc --noEmit
        working-directory: web
      - name: test
        run: npm test
        working-directory: web
      - name: build
        run: npm run build
        working-directory: web
      - name: the committed bundle is current
        # A committed build artifact goes stale silently. This is the mitigation, and it is a
        # diff rather than a rule somebody has to remember.
        run: |
          git diff --exit-code -- src/chainlens/ui/static || {
            echo "the committed bundle is out of date; run \`make ui\` and commit the result"
            exit 1
          }
      - name: print the bundle size
        # Bytes every `pip install` pays for, including headless ones. Printed so growth is a
        # decision rather than an accident.
        run: |
          echo "gzipped, as served:"
          for file in src/chainlens/ui/static/assets/*; do
            printf '  %-28s %8s\n' "$(basename "$file")" "$(gzip -c "$file" | wc -c)"
          done

  # The book has never been built in CI, so this is new coverage rather than a moved job. The
  # *staleness* of the generated reference is gated in `make check` -- that test is Python-only and
  # needs none of this. What this job adds is that the book builds and its links resolve.
  #
  # `cargo install` rather than a prebuilt-binary action, so the workflow stays on first-party
  # actions at the cost of a few minutes. If this becomes the slowest job here, the fast path is
  # `taiki-e/install-action` -- which is a third-party action, and therefore a supply-chain
  # decision rather than a change to make on a whim.
  docs:
    name: the book builds and its links resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo install mdbook mdbook-linkcheck2 --locked
      # linkcheck runs as an output backend inside this, so a broken internal link fails it.
      - run: make docs

  # The calculus. `make check` deliberately gains nothing that needs Lean or the network, so the
  # half of the gate that runs everywhere is `tests/calculus/test_lean_claims.py` -- and that test
  # reads the gate files as *text*. It cannot tell whether the proofs elaborate, whether a theorem
  # still exists, or whether one rests on an axiom this project did not agree to. Only
  # `tools/check_lean_axioms.py` does that, and before this job nothing ran it.
  #
  # The Mathlib cache is fetched rather than built: ~2 minutes and 7,335 files, against the hours a
  # from-source build takes. One module needs Mathlib; the other eight build against Lean core.
  lean:
    name: the calculus builds and the axiom gate passes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          # A first-party action for the toolchain, which reads `lean/lean-toolchain` -- so the
          # version is pinned in the repository rather than here, the same arrangement `.nvmrc`
          # gives the front end.
          #
          # `build: false` because the gate builds first itself, on purpose: `lake env lean`
          # resolves an import to the compiled olean, so a `sorry` added and not rebuilt is
          # invisible. The cache fetch is left to the action, which runs `lake exe cache get`
          # for a project downstream of Mathlib -- ~2 minutes, against hours from source.
          #
          # The action also offers an `axiom-audit` input defaulting to exactly the three
          # axioms this project permits. It is not used: this project's own gate walks its two
          # gate files by name and reports per theorem, which is what the pages cite.
          build: false
          test: false
          lint: false
          use-mathlib-cache: true
          lake-package-directory: lean
      - name: the axiom gate
        working-directory: lean
        # stdlib only: `python3` rather than a `uv run`, so this job does not depend on the
        # Python side of the repository being installed.
        run: python3 ../tools/check_lean_axioms.py

  # One artifact, two descriptions: the pydantic models are the source, the JSON Schema and the
  # zod modules are generated from them. This is what makes "a field added in Python without a
  # TypeScript change fails CI" true rather than aspirational.
  contract:
    name: the wire contract is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # hatch-vcs needs tags for version derivation
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: uv sync --all-groups
      - run: npm ci
        working-directory: web
      - run: make contract
      - name: nothing drifted
        run: |
          # `web/src/schema` is in the pathspec because the generated zod modules land there, and
          # leaving it out meant a stale one was not a red build. It is the half of the contract the
          # front end actually imports, so a drift there is the more dangerous of the two.
          git diff --exit-code -- web/schema web/src/schema tests/ledger/fixtures tests/ui/fixtures || {
            echo "the generated contract is out of date; run \`make contract\` and commit the result"
            exit 1
          }

  build:
    name: build wheel + sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      - name: verify the wheel is importable in a clean env
        run: |
          uv venv /tmp/verify
          uv pip install --python /tmp/verify/bin/python dist/*.whl
          /tmp/verify/bin/python -c "import chainlens; print(chainlens.__version__)"
      - name: the bundle really shipped, and the command runs
        # A bundle that silently fails to ship is the failure mode here: the package would
        # install, import and answer every API call, and only `ui serve` would be broken.
        run: |
          /tmp/verify/bin/python -c "
          import importlib.resources
          import chainlens.ui
          index = importlib.resources.files('chainlens.ui').joinpath('static/index.html')
          assert index.is_file(), 'the bundle is not in the wheel'
          print('bundle present:', index)
          "
          /tmp/verify/bin/chainlens ui --help > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # Early warning: httpx 1.0 is in flight and will be breaking. We pin <1.0 for users, so this
  # job is how we hear about it before they do.
  #
  # **This job is green while the breakage is somebody else's, and that is the whole design.**
  # Measured against httpx 1.0.dev6 (2026-10-08), three separate things break and only the third
  # is ours:
  #
  #   1. `hishel` 1.4.0 — a *core* dependency — fails at import:
  #        hishel/_async_httpx.py: from httpx import RequestNotRead
  #        ImportError: cannot import name 'RequestNotRead'
  #   2. `respx` — a dev-only test dependency — fails at import:
  #        respx/handlers.py: def __init__(self, transport: httpx.BaseTransport)
  #        AttributeError: module 'httpx' has no attribute 'BaseTransport'
  #   3. `providers/transport.py` uses `httpx.AsyncBaseTransport`, which 1.0 renamed to
  #      `Transport`. This is the one that is ours.
  #
  # Its first version ran `pytest -x -q` and went red on every commit for reason 2 — dying during
  # collection, before any chainlens module was imported — so a dependency's incompatibility and
  # this library's own looked identical. **A check that is red on every commit is a check people
  # stop reading**, which is worse than not having one. The tool now separates the two by looking
  # at which frame of the traceback raised, and the job's log names whichever library is blocking.
  #
  # It stays non-blocking even when red, and that is not the same cowardice: a red mark now means
  # `transport.py` needs migrating, and that migration is impossible while 0.28 must keep working
  # — so there is nothing to gate on. The job exists to say *when the work becomes possible*.
  httpx-prerelease:
    name: httpx pre-release (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-groups
      - run: uv pip install --upgrade --prerelease=allow "httpx>=1.0.0.dev0"
      # The guard is the assertion, not the install: a plain `uv run` re-syncs the
      # environment from the lockfile first, which reverts the prerelease install
      # above. Without --no-sync and this check the job tests the *pinned* version
      # and reports success, which is worse than not having the job at all.
      - name: confirm a pre-1.0-released httpx is what actually runs
        run: |
          uv run --no-sync python -c "
          import httpx
          major = int(httpx.__version__.split('.')[0])
          assert major >= 1, f'expected an httpx prerelease, got {httpx.__version__}'
          print('testing against httpx', httpx.__version__)
          "
      # The library, or a dependency of it — see the job's comment above. Green while the
      # breakage is somebody else's; red and specific when it is `transport.py`'s.
      - name: is the pre-release breaking this library, or something it depends on
        run: uv run --no-sync python tools/check_httpx_prerelease.py
