name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"

jobs:
  lint:
    name: lint + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # hatch-vcs needs tags for version derivation
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-groups
      - name: ruff check
        run: uv run ruff check --output-format=github .
      - name: ruff format
        run: uv run ruff format --check .
      - name: mypy
        run: uv run mypy src tests

  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-groups --python ${{ matrix.python-version }}
      # --block-network makes any accidental live request a hard failure, so a
      # developer's local-only success cannot hide a missing fixture.
      - name: pytest
        run: |
          uv run pytest --block-network \
            --cov --cov-report=term-missing --cov-report=xml \
            --cov-fail-under=90

  build:
    name: build wheel + sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      - name: verify the wheel is importable in a clean env
        run: |
          uv venv /tmp/verify
          uv pip install --python /tmp/verify/bin/python dist/*.whl
          /tmp/verify/bin/python -c "import chainlens; print(chainlens.__version__)"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # Non-blocking early warning: httpx 1.0 is in flight and will be breaking.
  # We pin <1.0 for users, but we want to hear about the breakage now.
  httpx-prerelease:
    name: httpx pre-release (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-groups
      - run: uv pip install --upgrade --prerelease=allow "httpx>=1.0.0.dev0"
      - run: uv run pytest -x -q
